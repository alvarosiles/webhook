<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>RRHH Directo</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        button {
            padding: 6px 10px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 60%;
        }

        table,
        th,
        td {
            border: 1px solid #ccc;
        }

        th,
        td {
            padding: 8px;
            text-align: center;
        }

        pre {
            background: #1e1e1e;
            color: #00ff88;
            padding: 15px;
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <h2>RRHH - Gestión JSON</h2>

    <input type="text" id="nombre" placeholder="Nombre">
    <input type="text" id="apellido" placeholder="Apellido">
    <input type="number" id="edad" placeholder="Edad">

    <button onclick="guardarRegistro()">Agregar</button>
    <button onclick="guardarJSON()">Guardar JSON</button>

    <h3>Lista</h3>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Edad</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>

    <h3>JSON Actual</h3>
    <pre id="jsonOutput"></pre>

    <script>

        let personas = [];

        /* 🔥 Se ejecuta automáticamente al cargar */
        window.addEventListener("DOMContentLoaded", abrirArchivo);

        async function abrirArchivo() {
            try {
                const response = await fetch('./rrhh.json');
                if (!response.ok) throw new Error("No se pudo cargar el archivo");

                personas = await response.json();
                mostrar();
            } catch (error) {
                console.error(error);
                alert("Error al abrir rrhh.json");
            }
        }

        function mostrar() {
            const tabla = document.getElementById("tabla");
            tabla.innerHTML = "";

            personas.forEach(p => {
                tabla.innerHTML += `
      <tr>
        <td>${p.nombre}</td>
        <td>${p.apellido}</td>
        <td>${p.edad}</td>
      </tr>
    `;
            });

            document.getElementById("jsonOutput").textContent =
                JSON.stringify(personas, null, 4);
        }

        function guardarRegistro() {

            const nombre = document.getElementById("nombre").value;
            const apellido = document.getElementById("apellido").value;
            const edad = document.getElementById("edad").value;

            if (!nombre || !apellido || !edad) {
                alert("Todos los campos son obligatorios");
                return;
            }

            personas.push({
                nombre,
                apellido,
                edad: Number(edad)
            });

            limpiar();
            mostrar();
        }

        function guardarJSON() {
            const contenido = JSON.stringify(personas, null, 4);

            const blob = new Blob([contenido], { type: "application/json" });
            const enlace = document.createElement("a");

            enlace.href = URL.createObjectURL(blob);
            enlace.download = "./base.json";

            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);

            URL.revokeObjectURL(enlace.href);
        }

        function limpiar() {
            document.getElementById("nombre").value = "";
            document.getElementById("apellido").value = "";
            document.getElementById("edad").value = "";
        }

    </script>

</body>

</html>
